<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Contas</title>
    <link rel="icon" href="/img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/cadastrar.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <a class="navbar-brand" href="/admin/home">
                <img src="/img/icon.png" width="50" height="50" class="d-inline-block align-top" style="margin-left: 5vw;" alt="">
                ReqHub
            </a>
            <div class="ml-auto">
                <a th:href="@{/logout}" class="navbar-brand">
                    <span class="ml-2" style="font-size: 20px;">Sair</span>
                </a>
            </div>
        </nav>
    </header>

    <div class="container mt-5">
        <a th:href="@{/admin/home}" class="btn btn-link text-dark mb-3">
            <i class="bi bi-arrow-left me-2"></i>Voltar para a Home
        </a>
        <h2>Gerenciamento de Contas</h2>
        <div class="mt-4">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Tipo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nome}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td th:text="${usuario.tipo}"></td>
                        <td>
                            <a th:href="@{/admin/editarUsuario/{id}(id=${usuario.id})}" class="btn btn-warning btn-sm me-2">Editar</a>
                            <form th:action="@{/admin/excluirUsuario/{id}(id=${usuario.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja excluir este usuário?');">Excluir</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${usuarios.isEmpty()}">
                        <td colspan="4" class="text-center">Nenhum usuário encontrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        <p>© 2025 ReqHub. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
